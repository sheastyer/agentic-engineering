name: CI

# Run the test suite on every PR (and on pushes to main for a post-merge signal).
# Runs on GitHub-hosted runners. This repo is PUBLIC, so `pull_request` jobs can
# be triggered by fork PRs; those must never land on the homelab's self-hosted
# runner (LXC 111 shares a host and a docker-group user with private repos).
# Security audit 2026-10-28 (homelab docs/security-audit-2026-10-28.html).
on:
  pull_request:
  push:
    branches: [main]

# Read-only token for every job (fork PRs already get read-only; this makes
# pushes to main the same).
permissions:
  contents: read

# A newer push to the same PR cancels the in-flight run so the runner isn't tied up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure the Temporal CLI (dev server used by the workflow tests)
        run: |
          # Installs to ~/.temporalio/bin — the path tests/helpers.py resolves.
          if [ ! -x "$HOME/.temporalio/bin/temporal" ]; then
            curl -sSf https://temporal.download/cli.sh | sh
          fi
          "$HOME/.temporalio/bin/temporal" --version

      - name: Create venv and install (dev + slack extras)
        run: |
          # slack extra pulls in fpdf2 + markdown, which the humanio PDF-render tests need.
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e '.[dev,slack]'

      - name: Run tests
        run: |
          . .venv/bin/activate
          # Docker-backed tests self-skip when no daemon is reachable; ubuntu-latest
          # ships Docker, so the sandbox-isolation gate is exercised here.
          pytest -q
